# Example zclip configuration file.

[debugging]
# 1024 * 1024 * 512 = 512MB. Might be useful to set for debugging purposes. 
# memory_limit = 536870912

[net]
# You can optionally specify a port here. Defaults to 48500.
daemon_bind_address = "127.0.0.1"

# A list of (internet) peers. Pubkeys can be copied over out of band, similar to SSH.
# A keypair is generated on first launch of the daemon.
[[net.peers]]
# As we can see, Bob is just a peer I made up for testing purposes.
nickname = "Bob"
pubkey = ""
addr = "127.0.0.1:48501"
